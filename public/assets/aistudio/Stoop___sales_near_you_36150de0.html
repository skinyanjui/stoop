<style>
:root {
  /* Stoop brand: Evergreen teal on cool paper. One accent; everything else is cool neutral. */
  --background:#fbfdfc; --background-subtle:#f3f7f6; --foreground:#16201e;
  --gray-100:#eef3f2; --gray-200:#e3eae8; --gray-300:#d3dcd9; --gray-400:#b9c5c1;
  --gray-500:#92a19c; --gray-600:#73827d; --gray-700:#526360; --gray-800:#384643;
  --gray-900:#243230; --gray-1000:#16201e;
  --brand:#0f766e; --brand-hover:#115e59; --brand-subtle:#e3f5f1; --brand-ink:#0b5f58; --on-brand:#fff;
  --blue:#0070f3; --blue-subtle:#e6f0fd; --red:#e5484d; --amber:#f5a623; --green:#45a557;
  --border:var(--gray-300); --text-muted:var(--gray-700);
  --radius-sm:4px; --radius-md:6px; --radius-lg:8px; --radius-xl:12px; --radius-full:9999px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
  --shadow-lg:0 12px 32px rgba(0,0,0,.12);
  --scrim:rgba(0,0,0,.4);
  --ease:cubic-bezier(.4,0,.2,1);
  --duration-fast:100ms; --duration-base:150ms; --duration-slow:250ms;
  --font-sans:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --control-h:36px;
  --map-land:var(--gray-100); --map-road:var(--gray-300); --map-water:var(--blue-subtle); --map-south:var(--gray-200);
}
@media (prefers-color-scheme: dark) {
  :root {
    --background:#0c1211; --background-subtle:#111917; --foreground:#e8f0ee;
    --gray-100:#141d1b; --gray-200:#1a2421; --gray-300:#27342f; --gray-400:#3b4b46;
    --gray-500:#7b8c87; --gray-600:#98a9a4; --gray-700:#b0bfba; --gray-800:#ccd8d4;
    --gray-900:#e0e9e6; --gray-1000:#e8f0ee;
    --brand:#2dd4bf; --brand-hover:#5eead4; --brand-subtle:#0c2a26; --brand-ink:#5eead4; --on-brand:#04201c;
    --blue:#3291ff; --blue-subtle:#10233c; --red:#ff6369; --amber:#f7b955; --green:#5dc36f;
    --scrim:rgba(0,0,0,.6);
  }
}
@media (max-width: 767px) { :root { --control-h:44px; } }

*, *::before, *::after { box-sizing:border-box; }
html, body { margin:0; height:100%; }
body { font:400 14px/20px var(--font-sans); color:var(--foreground); background:var(--background); -webkit-font-smoothing:antialiased; }
html { -webkit-text-size-adjust:100%; }
button, a { touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
button, input, select, textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* ---------- Layout ---------- */
.app { position:relative; height:100vh; height:100dvh; display:flex; flex-direction:column; }
.header { display:flex; align-items:center; gap:16px; padding:12px 16px; border-bottom:1px solid var(--border); background:var(--background); }
.brand { display:flex; align-items:center; gap:8px; font-size:20px; line-height:28px; font-weight:600; letter-spacing:-.01em; margin:0; }
.brand-mark { width:28px; height:28px; border-radius:var(--radius-md); background:var(--brand); color:var(--on-brand); display:flex; align-items:center; justify-content:center; flex:none; margin-left:0 !important; }
.brand-mark svg { width:18px; height:18px; }
.brand > span:not(.brand-mark) { color:var(--text-muted); font-weight:400; font-size:14px; letter-spacing:0; margin-left:8px; display:none; white-space:nowrap; }
.search { position:relative; flex:1; max-width:480px; }
.combo { position:relative; }

const PayIcon = ({ id, size = 22 }) => {

  return h('span', { className: 'pay-tile', style: { width: size, height: size, fontSize: size <= 20 ? 9 : 10 }, title: m.label, 'aria-hidden': true },
    m.icon ? h(Icon, { name: m.icon, size: Math.round(size * .7) }) : m.mono);
};
const PayPicker = ({ value, onChange, labelId }) =>
  h('div', { className: 'pay-grid', role: 'group', 'aria-labelledby': labelId },

      const on = value.includes(m.id);
      return h('button', { key: m.id, type: 'button', className: 'chip pay-chip', 'aria-pressed': on, onClick: () => onChange(on ? value.filter(x => x !== m.id) : [...value, m.id]) },
        h(PayIcon, { id: m.id, size: 20 }), m.label);
    }));
const PayRow = ({ pay, max = 3 }) => {
  const list = PAYMENTS.filter(m => pay.includes(m.id)); if (!list.length) return null;
  const shown = list.slice(0, max), rest = list.length - shown.length;
  return h('div', { className: 'srow-pay', role: 'img', 'aria-label': 'Accepts ' + list.map(m => m.label).join(', ') },
    h('span', { className: 'pay-lbl', 'aria-hidden': true }, 'Accepts'),
    h('span', { className: 'pay-icons' }, shown.map(m => m.id === 'cash'

    rest > 0 && h('span', { className: 'pay-more' }, '+' + rest));
};

/* ================= Master list =================
   Every category and item that has ever been entered, with how many listings used it.
   Suggestions are ranked by that count, new typed entries join the list, and an item remembers which categories it is used under.
   Shape maps 1:1 to a table: taxonomy(type, name, count, cats). Held in memory here; a database makes it shared across everyone. */
const norm = t => t.trim().replace(/\s+/g, ' ');
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
const mkey = (type, name) => { const k = norm(name).toLowerCase(); return type + ':' + (k.length > 3 && k.endsWith('s') ? k.slice(0, -1) : k); };
function addTo(m, type, name, cats, n) {
  const k = mkey(type, name);
  const e = m[k] || (m[k] = { type, name: cap(norm(name)), count: 0, cats: {} });
  e.count += n;
  (cats || []).forEach(c => { e.cats[c] = (e.cats[c] || 0) + n; });
}
function buildMaster(sales) {
  const m = {};
  CATS.forEach(c => addTo(m, 'category', c, [], 0));
  Object.keys(CATALOG).forEach(c => CATALOG[c].forEach(i => addTo(m, 'item', i, [c], 0)));

function shrinkPhoto(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 960 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('unreadable')); };
    img.src = url;
  });
}

    else if (at > 0 && at % 2 === 1) { const [sel] = ordered.splice(at, 1); ordered.splice(at - 1, 0, sel); }
    // Ads sit in the grid as a card-sized cell: one after the 5th sale, then after every 10th. The banner stays at the end.
    const out = []; let slots = 0, sinceAd = 0, n = 0;
    ordered.forEach((s, k) => {
      const open = s.id === selectedId;
      if (open && slots === 1) { out.push(h('li', { key: 'adf-' + k, className: 'ad-cell' }, h(AdCard))); slots = 0; sinceAd = 0; }
      else if (!open && slots === 1 && k > 0 && ((n === 0 && sinceAd >= 5) || (n > 0 && sinceAd >= 10))) {
        out.push(h('li', { key: 'adc-' + n, className: 'ad-cell' }, h(AdCard)));
        n++; sinceAd = 0; slots = 0;
      }
      out.push(h('li', { key: s.id, className: open ? 'is-open' : undefined }, h(SaleRow, { s, selected: open, onToggle: toggleCard, onHover: setHoverId, saved: saved.includes(s.id), onSave: toggleSave })));
      sinceAd++;
      if (open) slots = 0; else slots = (slots + 1) % 2;
    });
    if (slots === 1) out.push(h('li', { key: 'adf-end', className: 'ad-cell' }, h(AdCard)));
    out.push(h('li', { key: 'ad-banner', className: 'ad-li' }, h(AdSlot, { banner: true })));
    return h('ul', { className: 'rows' }, out);
  };

  const renderFilters = (floating, bar) =>
    h('div', { className: 'filters' + (floating ? ' is-floating' : '') + (bar ? ' is-bar' : ''), role: 'group', 'aria-label': 'Filters' },
      (saved.length > 0 || onlySaved) && h(Chip, { key: 'saved', active: onlySaved, label: 'Saved sales', onClick: () => setOnlySaved(v => !v) }, h(Icon, { name: 'heart', size: 12 }), 'Saved (' + saved.length + ')'),
      payF.map(id => h(Chip, { key: 'pay-' + id, active: true, label: 'Accepts ' + payOf(id).label, onClick: () => setPayF(p => p.filter(x => x !== id)) }, payOf(id).label)),
      items.map(i => h(Chip, { key: 'item-' + i, active: true, onClick: () => setItems(p => p.filter(x => x !== i)) }, i)),
      h(Chip, { active: when === 'today', onClick: () => setWhen(when === 'today' ? null : 'today') }, 'Today'),
      h(Chip, { active: when === 'weekend', onClick: () => setWhen(when === 'weekend' ? null : 'weekend') }, 'This weekend'),
      h('button', { type: 'button', className: 'chip', 'aria-haspopup': 'dialog', onClick: () => setPaySheet(true) }, h(Icon, { name: 'card', size: 14 }), 'Accepts'),
      h('span', { className: 'divider', 'aria-hidden': true }),
      filterCats.map(c => h(Chip, { key: c, label: c, active: cats.includes(c), onClick: () => toggleCat(c) }, h(Icon, { name: catIcon(c), size: 14 }), c)),
      hasFilters && h('button', { className: 'btn btn-ghost btn-sm', style: { flex: 'none' }, onClick: clearAll }, 'Clear all'));

  return h('div', { className: 'app' + (view === 'list' ? ' is-list' : '') + (topHidden && view === 'list' ? ' top-hidden' : ''), ref: appRef },
    h('header', { className: 'header' },
      h('h1', { className: 'brand' }, h('span', { className: 'brand-mark', 'aria-hidden': true, dangerouslySetInnerHTML: { __html: GARAGE } }), 'Stoop', h('span', null, 'sales near you')),
      h('div', { className: 'search', role: 'search' },
        h(Combobox, { id: 'q', label: 'Search an item, city, ZIP code or address', value: place, onChange: setPlace, options: headerOptions, onPick: pickHeader, placeholder: 'Search an item, city or ZIP', enterKeyHint: 'search', leading: h(Icon, { name: 'search' }),
          trailing: h('button', { type: 'button', className: 'locate', 'aria-label': 'Use my location', onClick: locateMe }, h(Icon, { name: 'locate' })) })),
      h('div', { className: 'header-actions' },
        h('button', { className: 'btn btn-primary header-add', onClick: openAdd }, h(Icon, { name: 'plus' }), 'Add sale'),
        h('button', { type: 'button', className: 'avatar-btn', 'aria-label': user ? 'Profile, ' + user.name : 'Sign up or log in', title: user ? user.name : 'Sign up', onClick: openProfile }, h(Avatar, { user })))),
    h(FilterBar, null, renderFilters(false, true)),
    h('main', { className: 'main', 'data-view': view },
      h('section', { className: 'panel', 'aria-label': 'Sale listings' },
        renderFilters(false),
        h('div', { className: 'panel-count' },
          h('strong', null, loading ? 'Finding sales…' : visible.length + (visible.length === 1 ? ' sale' : ' sales')),
          h('span', null, areaName || 'Current map area')),
        h('div', { className: 'panel-scroll', ref: scrollRef },
          listBody(),
          !loading && h('p', { className: 'list-foot' }, cloudOn ? 'Sample listings with approximate pins. Sales you post are shared with everyone here.' : 'Sample listings with approximate pins. Sales you post stay until you leave.'))),
      h('section', { className: 'pane-map', 'aria-label': 'Map' },
        h(SaleMap, { sales: matches, selectedId, hoverId, onSelect: pinSelect, centerReq, viewReq, onView }),
        h('div', { className: 'map-filters' }, renderFilters(true)),
        selected && h('div', { className: 'map-peek' }, h(SaleRow, { s: selected, compact: true, saved: saved.includes(selected.id), onSave: toggleSave, onToggle: id => { setView('list'); setTimeout(() => { const el = document.getElementById('sale-' + id); if (el) el.scrollIntoView({ block: 'nearest' }); }, 50); } })))),
    h('nav', { className: 'bottom-bar', 'aria-label': 'View and actions' },
      h('div', { className: 'segmented', role: 'group', 'aria-label': 'View' },
        h('button', { type: 'button', 'aria-pressed': view === 'list', onClick: () => setView('list') }, h(Icon, { name: 'list' }), 'List'),
        h('button', { type: 'button', 'aria-pressed': view === 'map', onClick: () => setView('map') }, h(Icon, { name: 'map' }), 'Map')),
      h('button', { type: 'button', className: 'btn btn-primary', onClick: openAdd }, h(Icon, { name: 'plus' }), 'Add'),
      h('button', { type: 'button', 'aria-label': user ? 'Profile, ' + user.name : 'Profile', onClick: openProfile }, h(Avatar, { user, size: 20 }), 'Profile')),
    profileOpen && h(ProfileDialog, { onClose: closeProfile, user, mine: sales.filter(x => x.ownerId === 'me'), onRegister: u => setUser(u), onPayments: v => setUser(u => ({ ...u, payments: v })), onSignOut: () => setUser(null),
      onEdit: sl => { setProfileOpen(false); setEditing(sl); }, onDelete: deleteSale, onView: id => { closeProfile(); setSelectedId(id); setCenterReq({ id, n: Date.now() }); }, onAdd: () => { setProfileOpen(false); setAdding(true); } }),
    paySheet && h(PaySheet, { value: payF, onChange: setPayF, onClose: () => setPaySheet(false), count: visible.length }),
    editing && h(AddSaleDialog, { initial: editing, onClose: () => { setEditing(null); setProfileOpen(true); }, onSubmit: updateSale, master, defaultPay: user && user.payments, start: null }),
    adding && h(AddSaleDialog, { onClose: closeAdd, onSubmit: addSale, master, defaultPay: user && user.payments, start: mapView ? { lat: mapView.lat, lng: mapView.lng, zoom: Math.max(mapView.zoom, 12) } : null }),
    toast && h('div', { className: 'toast', role: 'status' }, h('span', null, toast.msg), toast.undo && h('button', { type: 'button', onClick: toast.undo }, 'Undo')));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
